# Run-time and pipeline settings (design choices, not real-world facts).
# Real-world numbers belong in assumptions.yaml.

project:
  name: CoolScore Dubai
  version: 0.0.1

random_seed: 42

paths:
  raw: data/raw
  simulated: data/simulated
  real_bills: data/real_bills
  demo: data/demo

weather:
  source: open-meteo-archive
  endpoint: https://archive-api.open-meteo.com/v1/archive
  years: [2023, 2024, 2025]
  timezone: Asia/Dubai
  # Phase 1 decision: ECMWF IFS 9 km. ERA5 (0.25°) puts all three sites in one
  # grid cell. All models run cool at Dubai International (urban nights), so
  # temperature and dew point are bias-corrected to airport observations.
  model: ecmwf_ifs
  bias_correction:
    # microclimate -> NOAA ISD station used for its correction
    site_station:
      coastal: "41194099999"   # Dubai International; no coastal station exists (assumption)
      central: "41194099999"   # Dubai International
      inland: "41194599999"    # Al Maktoum International (next to the inland site)
    holdout_year: 2025
    smooth_hours: 3

simulation:
  n_scenarios: 40000
  holdout_fraction: 0.2
  batch_size: 5000

model:
  quantiles: [0.1, 0.5, 0.9]
  fidelity_r2_target: 0.95
  max_artifact_mb: 50

llm:
  provider: anthropic
  # Re-check current model names against Anthropic's docs in Phase 7.
  model: claude-haiku-4-5-20251001
  max_tokens: 1024
  # Without ANTHROPIC_API_KEY the app falls back to the manual form + templates.

app:
  currency: AED
  area_unit: sqft
  default_setpoint_c: 24
  disclaimer: "Estimates for guidance only — not a quote from DEWA or any cooling provider."
  simulated_label: "Simulated estimate — based on building physics, not on this unit's bills."
