  # The Business Case page and docs/business_model.md read these defaults.
  usd_to_aed:
    value: 3.67
    unit: AED per USD
    source: https://www.witpress.com/Secure/elibrary/papers/SC20/SC20008FU1.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "Rodriguez-Ubinas et al. 2020 Table 2 note: '3.67 Dirhams = USD $1' (the dirham is pegged to the US dollar)."
    phase: 8
  llm_price_per_mtok_usd:
