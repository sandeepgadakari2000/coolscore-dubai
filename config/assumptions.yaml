# CoolScore assumption register.
# Every real-world number used anywhere in CoolScore lives here, and nowhere else.
#
# Each record has exactly these fields:
#   value         number, list or mapping; null = PLACEHOLDER, not yet researched
#   unit          physical or currency unit
#   source        URL of the primary source (null while value is null)
#   date_checked  YYYY-MM-DD when the value was last checked against the source
#                 (notes say when only an abstract or search snippet was readable)
#   verify        true until Sandeep has personally confirmed the value
#   notes         context, caveats, competing figures
#   phase         build phase that researches / first uses it
#
# Ranges are {low, central, high}: simulation samples within low-high as hidden
# variation; central is used for single deterministic runs.
# "MODELLING ASSUMPTION" in notes = no primary source gives this number; the
# cited source anchors it. These are the first things real bills should test.
#
# Rule: code must refuse to run a stage whose required records are still null.
# Tests (tests/test_config.py) enforce the schema.

constants:
  rt_to_kw_thermal:
    value: 3.516853
    unit: kW thermal per refrigeration ton (so 1 RTh = 3.516853 kWh thermal)
    source: https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b9
    date_checked: 2026-10-03
    verify: false
    notes: Definition, not a tariff. NIST SP 811 Appendix B.9 lists ton of refrigeration (12 000 Btu_IT/h) = 3.516 853 E+03 W.
    phase: 3
  air_volumetric_heat_capacity:
    value: 1200
    unit: J/(m3 K)
    source: https://www.sysecol2.ethz.ch/OptiControl/LiteratureOC/ISO_07_FDIS_13790_ApprovalDraft.pdf
    date_checked: 2026-10-03
    verify: false
    notes: "ISO 13790 Eq. 21: rho_a c_a = 1 200 J/(m3 K)."
    phase: 2
  latent_air_factor:
    value: {air_density_kg_m3: 1.2, vapour_heat_j_kg: 2500000}
    unit: "latent W = density x airflow (m3/s) x vapour_heat x delta humidity ratio (kg/kg)"
    source: https://www.tagengineering.ca/wp-content/uploads/2015/01/1997-Fundamentals_28.pdf
    date_checked: 2026-10-03
    verify: false
    notes: "1997 ASHRAE Fundamentals Ch. 28 Eq. 23: q_l = 60 x 0.075 x 1076 Q W = 4840 Q W (Btu/h, cfm); 0.075 lb/ft3 = 1.2 kg/m3 and 1076 Btu/lb = 2.50 MJ/kg (vapour at 75 F 50% RH less condensate at 50 F)."
    phase: 2

billing:
  vat_rate:
    value: 0.05
    unit: fraction of the bill (applied once, to the bill total)
    source: https://www.dewa.gov.ae/en/consumer/billing/slab-tariff
    date_checked: 2026-10-03
    verify: true
    notes: "DEWA slab-tariff page: '5% VAT is applicable on these tariffs'. Empower charges page: 'Each Charge/Service ... is subjected for VAT of 5%'."
    phase: 3

  dewa:
    residential_electricity_slabs:
      value: [{upto_kwh: 2000, aed_per_kwh: 0.230}, {upto_kwh: 4000, aed_per_kwh: 0.280}, {upto_kwh: 6000, aed_per_kwh: 0.320}, {upto_kwh: null, aed_per_kwh: 0.380}]
      unit: AED per kWh by monthly consumption slab (residential/commercial)
      source: https://www.dewa.gov.ae/en/consumer/billing/slab-tariff
      date_checked: 2026-10-03
      verify: true
      notes: "Read on DEWA's page (last updated 16 May 2026): 0-2000 kWh 0.230, 2001-4000 0.280, 4001-6000 0.320, 6001+ 0.380 AED/kWh."
      phase: 3
    fuel_surcharge:
      value: 0.060
      unit: AED per kWh
      source: https://www.dewa.gov.ae/en/consumer/billing/slab-tariff
      date_checked: 2026-10-03
      verify: true
      notes: "'Fuel Surcharge - October 2026: Electricity D 0.060/kWh'. Varies with fuel prices; re-check monthly."
      phase: 3
    meter_service_charge:
      value: {type_1: 5, type_2: 6, type_3: 35}
      unit: AED per month (fixed; not part of the marginal cooling cost)
      source: https://www.dewa.gov.ae/en/consumer/billing/slab-tariff
      date_checked: 2026-10-03
      verify: true
      notes: Shown only in the estimated DEWA share of the true monthly cost.
      phase: 3
    housing_fee_rate:
      value: 0.05
      unit: fraction of annual rent, billed monthly through DEWA
      source: https://www.engelvoelkers.com/ae/en/resources/housing-fee-dubai
      date_checked: 2026-10-03
      verify: true
      notes: "Dubai Municipality housing fee, 5% of annual rent collected monthly on the DEWA bill (several guides agree; search snippets, no government page opened). Used only in the 'true monthly cost'."
      phase: 3
    other_household_kwh:
      value: {low: 100, central: 200, high: 300}
      unit: kWh per month (water heating, cooking etc., on top of the physics appliance/lighting energy)
      source: null
      date_checked: null
      verify: true
      notes: "PLACEHOLDER: no published Dubai breakdown found. Only positions the cooling kWh within DEWA's slabs (marginal pricing); it is never billed as cooling."
      phase: 3

  district_cooling:
    consumption_charge:
      value: 0.568
      unit: AED per RTh (ton-hour)
      source: https://www.empower.ae/customer-care/charges-explanation/
      date_checked: 2026-10-03
      verify: true
      notes: "Empower charges page: 'at a rate of AED 0.568 fils per RT per hour' (reads as AED 0.568/RTh). Other providers may differ; the app lets users override with their own bill's rates."
      phase: 3
    capacity_charge:
      value: 750
      unit: AED per RT per year, billed monthly by days in month
      source: https://www.empower.ae/customer-care/charges-explanation/
      date_checked: 2026-10-03
      verify: true
      notes: "Empower: 'AED 750 per Refrigeration Ton (RT) per annum, billed monthly in advance, based on the number of days in the month'; example 6 RT x 750 = 4,500/yr; the page prints January as '4500/365*31 = 387.50', but that formula gives 382.19 (387.50 matches a 360-day year). We follow the stated formula. Payable even with zero use."
      phase: 3
    fuel_surcharge:
      value: 0.075
      unit: AED per RTh
      source: https://rsbdubai.gov.ae/media/baufmpnp/rd10-tariffs-v14.pdf
      date_checked: 2026-10-03
      verify: true
      notes: "RSB RD10 v1.3 (17-09-2025): fuel surcharge cap AED 0.075/TRh; consumption tariff cap 0.643/TRh 'inclusive of Fuel Surcharge' = 0.568 + 0.075. Empower passes DEWA's fuel surcharge through 'as notified'. Using the cap is an upper-bound reading."
      phase: 3
    meter_admin_fee:
      value: {low: 16.67, central: 16.67, high: 30}
      unit: AED per month
      source: https://www.empower.ae/customer-care/charges-explanation/
      date_checked: 2026-10-03
      verify: true
      notes: "Empower meter maintenance AED 50 per 3 months or AED 30 per month depending on location; RSB RD10 caps third-party billing-services fees at AED 30/month."
      phase: 3
    single_building_consumption_cap:
      value: 0.80
      unit: AED per RTh (no capacity charge allowed)
      source: https://rsbdubai.gov.ae/media/baufmpnp/rd10-tariffs-v14.pdf
      date_checked: 2026-10-03
      verify: true
      notes: "RD10: 'Consumption Tariff for Single Building District Cooling Systems' cap 0.80 AED/TRh plus fuel surcharge cap 0.075; 'No Capacity Charges are allowed to be charged to Units serviced by Single Building District Cooling Systems'. Used for the building_central_plant system at the cap (upper bound)."
      phase: 3
    deposit_cap_months:
      value: 8
      unit: months of capacity charges (refundable deposit, maximum)
      source: https://rsbdubai.gov.ae/media/baufmpnp/rd10-tariffs-v14.pdf
      date_checked: 2026-10-03
      verify: true
      notes: "RD10: deposits 'Must not exceed 8 months of Capacity Charges unless otherwise approved'. Shown as a move-in cost note."
      phase: 3
    contracted_capacity_sqft_per_rt:
      value: {low: 150, central: 200, high: 300}
      unit: sq ft of unit area per contracted RT
      source: https://utilitybilluae.com/district-cooling-cost-uae/
      date_checked: 2026-10-03
      verify: true
      notes: "MODELLING ASSUMPTION, the most important one in billing. Secondary guides (search snippets) quote typical contracted loads of 2-4 RT for studios, 3-5 RT for 1-bed and 5-7 RT for 2-bed units; Empower's own example uses 6 RT. RSB RD10 (2025) now requires allocation as a fair share of the building's contracted capacity, not installed equipment. Contracted RT = max(size / this, simulated design peak). Real bills (contracted_capacity_rt) will calibrate it."
      phase: 3

  equipment:
    split_ac_min_eer:
      value: {t1_35c: 9.5, t3_46c: 6.6}
      unit: EER (Btu/h per W) at T1 (35 C) and T3 (46 C) rating conditions
      source: https://www.wkcgroup.com/wp-content/uploads/2023/04/Al-Safat-Dubai-Green-Building-Evaluation-System.pdf
      date_checked: 2026-10-03
      verify: true
      notes: "Al Sa'fat Reference Table 502.01(2): air-cooled split systems < 65,000 Btu/h minimum 9.5 EER (T1, ARI 210/240) and 6.6 EER (T3, ISO 5151). COP = EER / 3.412. The T1->T3 drop gives the high-temperature derate used by the billing engine."
      phase: 3
    installed_efficiency_factor:
      value: {low: 0.7, central: 0.85, high: 1.0}
      unit: multiplier on the minimum-standard COP (age, maintenance, part load)
      source: https://www.wkcgroup.com/wp-content/uploads/2023/04/Al-Safat-Dubai-Green-Building-Evaluation-System.pdf
      date_checked: 2026-10-03
      verify: true
      notes: "MODELLING ASSUMPTION anchored on the Al Sa'fat minimum: installed, ageing units in older buildings may perform below the rated minimum."
      phase: 3
    fcu_fan_power:
      value: {low: 18, central: 25, high: 40}
      unit: W of fan power per kW of installed cooling capacity, while the coil runs
      source: https://feta.co.uk/client/files/HEVAC/1734700807-HEVAC_POS_SFP_for_fan_coil_units_Iss2.pdf
      date_checked: 2026-10-03
      verify: true
      notes: "MODELLING ASSUMPTION: UK guidance limits fan-coil specific fan power to 0.3-0.5 W/(l/s) (FETA/HEVAC statement, Approved Document L, search snippets); times ~60-80 l/s of air per kW of cooling gives ~18-40 W/kW. Not UAE-specific. Fan electricity is billed by DEWA even when chiller-free."
      phase: 3

physics:
  ground_albedo:
    value: {low: 0.12, central: 0.20, high: 0.40}
    unit: fraction (broadband ground reflectance)
    source: https://pvlib-python.readthedocs.io/en/stable/reference/generated/pvlib.irradiance.get_ground_diffuse.html
    date_checked: 2026-10-03
    verify: true
    notes: "pvlib docs: 'typically 0.1-0.4 for bare or vegetated ground'; pvlib SURFACE_ALBEDOS (citing PVsyst and Loutzenhiser et al. 2007, Solar Energy 81:254-267) lists asphalt 0.12, urban 0.18, concrete 0.30, sand 0.40. Central 0.20 is a modelling choice for dense urban ground; low/high bracket asphalt-to-sand. Frey, Rigo & Parlow 2007 (Int. J. Remote Sensing 28:2695-2712) report Dubai's urban albedo below the surrounding desert. Phase 2 samples within the range as hidden variation."
    phase: 1
  iso13790_constants:
    value: {h_is: 3.45, lambda_at: 4.5, h_ms: 9.1, f_w: 0.90, frame_fraction: 0.20, f_r_wall: 0.5, f_r_roof: 1.0, h_r: 4.5, delta_theta_er: 13.0}
    unit: "h_is, h_ms, h_r W/m2K; delta_theta_er K; others dimensionless"
    source: https://www.sysecol2.ethz.ch/OptiControl/LiteratureOC/ISO_07_FDIS_13790_ApprovalDraft.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "ISO/FDIS 13790:2007 (approval draft of ISO 13790:2008). Eq. 9 h_is=3.45, a_t=4.5; 12.2.2 h_ms=9.1; 11.4.2 F_w=0.90 (non-scattering glazing); frame fraction 'for cooling dominated climates for instance a fixed value of 0,20'; 11.4.6 F_r=0.5 vertical wall, 1 roof; h_r ~ 5 x emissivity (emissivity 0.9 -> 4.5); sky temperature depression 13 K for the tropics (11 K intermediate zones); Dubai at 25 N is assigned the tropics value."
    phase: 2
  thermal_mass_class:
    value: {medium: {am_per_af: 2.5, cm_per_af: 165000}, heavy: {am_per_af: 3.0, cm_per_af: 260000}}
    unit: "Am in m2 per m2 floor; Cm in J/K per m2 floor"
    source: https://www.sysecol2.ethz.ch/OptiControl/LiteratureOC/ISO_07_FDIS_13790_ApprovalDraft.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "ISO/FDIS 13790:2007 Table 12, simple hourly method. Concrete-frame apartments are sampled between 'medium' and 'heavy' (furnishings and gypsum ceilings decouple part of the slab mass): MODELLING ASSUMPTION on which class applies."
    phase: 2
  external_surface_resistance:
    value: 0.04
    unit: m2K/W
    source: https://www.sysecol2.ethz.ch/OptiControl/LiteratureOC/ISO_07_FDIS_13790_ApprovalDraft.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "ISO 13790 Eq. 46-47 take R_se from ISO 6946; 0.04 m2K/W is the ISO 6946 value for normal exposure (ISO 6946 itself not opened)."
    phase: 2
  opaque_solar_absorptance:
    value: {low: 0.3, central: 0.5, high: 0.7}
    unit: fraction
    source: https://www.sysecol2.ethz.ch/OptiControl/LiteratureOC/ISO_07_FDIS_13790_ApprovalDraft.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "MODELLING ASSUMPTION: light-to-medium facade finishes. ISO 13790 Eq. 46 defines how absorptance enters; it gives no default."
    phase: 2
  window_shading_reduction:
    value: {low: 0.6, central: 0.8, high: 1.0}
    unit: multiplier on glazing g-value (internal blinds/curtains, time-averaged)
    source: https://www.sysecol2.ethz.ch/OptiControl/LiteratureOC/ISO_07_FDIS_13790_ApprovalDraft.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "ISO 13790 Table G.2 gives reduction factors 0.20-0.95 for internal curtains/blinds when closed. Time-averaged residential use is a MODELLING ASSUMPTION (1.0 = never used)."
    phase: 2
  sc_to_shgc:
    value: 0.87
    unit: SHGC per unit shading coefficient
    source: https://www.witpress.com/Secure/elibrary/papers/SC20/SC20008FU1.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "Rodriguez-Ubinas et al. 2020 (DEWA R&D; WIT Trans. Ecol. Env. 249, doi:10.2495/SC200081) Table 4 lists the Al Sa'fat SC limits as SHGC ~0.35/0.28/0.22, i.e. SHGC = 0.87 x SC (3 mm clear-glass reference)."
    phase: 2
  infiltration_ach:
    value: {before_2005: {low: 0.4, central: 0.7, high: 1.0}, "2005_2014": {low: 0.3, central: 0.5, high: 0.8}, "2015_2021": {low: 0.2, central: 0.35, high: 0.6}, "2022_plus": {low: 0.1, central: 0.25, high: 0.4}}
    unit: air changes per hour (natural infiltration, annual average)
    source: https://www.wkcgroup.com/wp-content/uploads/2023/04/Al-Safat-Dubai-Green-Building-Evaluation-System.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "MODELLING ASSUMPTION. Anchor: Al Sa'fat 501.05 limits air leakage to 10 m3/h per m2 of envelope at 50 Pa (buildings >= 1 MW cooling) and 501.06 requires a leakage test for conditioned buildings, so the newest band is tightest. No measured infiltration data for Dubai apartments was found; real bills should calibrate this."
    phase: 2
  fresh_air_pretreated_share:
    value: {before_2005: 0.2, "2005_2014": 0.5, "2015_2021": 0.9, "2022_plus": 1.0}
    unit: probability that outdoor air is pre-treated centrally (its load is not on the unit meter)
    source: https://www.wkcgroup.com/wp-content/uploads/2023/04/Al-Safat-Dubai-Green-Building-Evaluation-System.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "Al Sa'fat 501.03: new air-conditioned buildings must have a central ventilation system supplying fresh air, hence ~1.0 for recent stock. Shares for older bands are a MODELLING ASSUMPTION (largest single source of unit-meter uncertainty; plan risk #3)."
    phase: 2
  untreated_ventilation_fraction:
    value: {low: 0.25, central: 0.5, high: 0.75}
    unit: fraction of the ASHRAE 62.2 whole-dwelling rate entering untreated (when not pre-treated)
    source: https://www.ashrae.org/file%20library/technical%20resources/standards%20and%20guidelines/standards%20addenda/62_2_2013_m_20151109.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "How much of the ASHRAE 62.2 rate reaches the unit coil untreated (kitchen/bath exhaust make-up air) in buildings without central pre-treatment is a MODELLING ASSUMPTION."
    phase: 2
  ashrae_622_ventilation:
    value: {per_m2_floor_ls: 0.15, per_person_ls: 3.5}
    unit: "L/s; Qtot = per_m2 x A_floor + per_person x (bedrooms + 1)"
    source: https://www.ashrae.org/file%20library/technical%20resources/standards%20and%20guidelines/standards%20addenda/62_2_2013_m_20151109.pdf
    date_checked: 2026-10-03
    verify: false
    notes: "ASHRAE 62.2 Eq. 4.1b (SI), read in the official addendum m PDF. Al Sa'fat 401.01 requires ASHRAE 62 compliance."
    phase: 2
  indoor_humidity_target:
    value: {low: 0.45, central: 0.50, high: 0.55}
    unit: relative humidity fraction at the cooling setpoint
    source: https://www.wkcgroup.com/wp-content/uploads/2023/04/Al-Safat-Dubai-Green-Building-Evaluation-System.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "Al Sa'fat 501.03 indoor design condition: 24 C dry bulb, relative humidity 50 +/- 5%."
    phase: 2
  people_gains:
    value: {awake_sensible_w: 72, awake_latent_w: 45, resting_sensible_w: 66, resting_latent_w: 31}
    unit: W per person (adjusted adult male/female mix)
    source: https://www.tagengineering.ca/wp-content/uploads/2015/01/1997-Fundamentals_28.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "1997 ASHRAE Fundamentals Ch. 28 Table 3: 'Seated, very light work - offices, hotels, apartments' 245 Btu/h sensible, 155 Btu/h latent (72 W / 45 W); 'Seated at theater' 225/105 Btu/h (66 W / 31 W) used for night-time resting. Newer editions should be checked."
    phase: 2
  appliance_lighting_gain:
    value: {low: 1.5, central: 3.0, high: 5.0, profile_w_m2: {"07-17": 8.0, "17-23": 20.0, "23-07": 2.0}}
    unit: W/m2 daily mean (appliances + lighting, sensible); profile = ISO hourly shape
    source: https://www.sysecol2.ethz.ch/OptiControl/LiteratureOC/ISO_07_FDIS_13790_ApprovalDraft.pdf
    date_checked: 2026-10-03
    verify: true
    notes: "ISO 13790 Table G.7 (residential, occupants + appliances): living room + kitchen 8 W/m2 (07-17), 20 (17-23), 2 (23-07), mean 9; other rooms mean 2.7-3.8. The shape is used for appliances; the low/central/high mean excluding occupants is a MODELLING ASSUMPTION anchored on those totals."
    phase: 2
  orientation_effect_literature:
    value: null
    unit: percent cooling difference by orientation (published, sanity check only)
    source: https://doi.org/10.3390/buildings14040876
    date_checked: null
    verify: true
    notes: "Left null: paper could not be opened. Search snippet of 'Smarter Window Selection for Smarter Energy Consumption: The Case of the UAE' (Buildings 2024, 14(4) 876): north-facing windows use 36% less annual energy than the other three directions; east- and west-facing windows use about 41% and 35% more daily cooling energy in August than north- and south-facing windows. Window-only effects; a whole unit's difference should be smaller. Compared in docs/evidence/physics.md."
    phase: 2

schedules:
  uae_weekend:
    value: [Saturday, Sunday]
    unit: weekend days (Friday afternoon off for the federal government)
    source: https://www.aljazeera.com/economy/2021/12/7/uae-announces-changes-to-workweek-for-employees-of-govt-sector
    date_checked: 2026-10-03
    verify: true
    notes: "From 1 Jan 2022 the federal government moved to a Saturday-Sunday weekend with a Friday half day; private-sector adoption varied (search snippets of the announcement coverage). All weather years (2023-25) are after the change."
    phase: 2
  ramadan_dates:
    value: {2023: ["2023-03-23", "2023-04-20"], 2024: ["2024-03-11", "2024-04-09"], 2025: ["2025-03-01", "2025-03-29"]}
    unit: first and last day of Ramadan (inclusive)
    source: https://en.wikipedia.org/wiki/Ramadan
    date_checked: 2026-10-03
    verify: true
    notes: "2024 and 2025 from Wikipedia's Umm al-Qura table (opened); 2023 from Al Arabiya's expected dates (search snippet). UAE moon-sighting can shift dates by a day. Used only by the optional Ramadan schedule."
    phase: 2

data_sources:
  open_meteo_terms:
    value: {endpoint: "https://archive-api.open-meteo.com/v1/archive", model: ecmwf_ifs, licence: CC BY 4.0, free_tier: non-commercial}
    unit: licence summary
    source: https://open-meteo.com/en/terms
    date_checked: 2026-10-03
    verify: true
    notes: "Read 2026-10-03: free API is for non-commercial use only (<10,000 calls/day); data licensed CC BY 4.0 with attribution. Commercial use needs a paid plan. Attribution shown in the app's Methodology page and data/raw/README.md."
    phase: 1
  noaa_isd_observations:
    value: {stations: {"41194099999": Dubai International, "41194599999": Al Maktoum International}, last_obs: "2025-08-25"}
    unit: station list
    source: https://www.ncei.noaa.gov/data/global-hourly/access/
    date_checked: 2026-10-03
    verify: false
    notes: NOAA Integrated Surface Database hourly observations (US government open data), used only to bias-correct and validate model temperature and dew point. Station files currently end 2025-08-25.
    phase: 1
  weather_bias_correction:
    value: {method: additive per month x hour, vars: [temp_c, dewpoint_c], coastal_uses: Dubai International}
    unit: method
    source: https://www.ncei.noaa.gov/data/global-hourly/access/
    date_checked: 2026-10-03
    verify: true
    notes: "Assumption: the Dubai International correction also applies to the coastal (Marina) cell, which has no station. Holdout 2025 results in docs/evidence/weather.md."
    phase: 1
  ghi_published_range:
    value: null
    unit: kWh/m2/yr global horizontal irradiation
    source: https://www.researchgate.net/publication/320076428_The_UAE_Solar_Atlas
    date_checked: null
    verify: true
    notes: "Left null because neither source could be opened. Sanity band only. Search snippets: UAE Solar Atlas reports 2100-2300 kWh/m2 GHI across the UAE; DEWA Shams Dubai connection guidelines (2020) quote about 2000-2100 kWh/m2 for Dubai (dewa.gov.ae returned 403)."
    phase: 1

sanity_bands:
  typical_monthly_bills_by_bedrooms:
    value: {0: [350, 450], 1: [450, 600], 2: [650, 850], 3: [900, 1200]}
    unit: AED per month, district cooling, tenant-paid (rough average band by bedrooms)
    source: https://utilitybilluae.com/district-cooling-cost-uae/
    date_checked: 2026-10-03
    verify: true
    notes: "Independent calculator site (no publication date): 'Studio AED 350-450, 1-bedroom AED 450-600, 2-bedroom AED 650-850, 3-bedroom AED 900-1,200'; it also quotes capacities 'Studio 3-4 RT, 1BR 4-5 RT, 2BR 6-8 RT, 3BR 10-12 RT'. Major portal guides (Property Finder, MyBayut) explain the tariff but give no typical bills. ROUGH SANITY BAND ONLY, never a model input."
    phase: 8

