# Map geometry for the direction helper (approximate WGS84 points; verify: true).
# These are public geographic locations used only to compute a compass bearing
# from a community to what its listings call "the view". Suggestions are always
# shown as "likely" and must be confirmed by the user.
verify: true
landmarks:   # name: {at: [lat, lon], match: words that identify it in a view description}
  burj khalifa: {at: [25.1972, 55.2744], match: [khalifa]}
  palm jumeirah: {at: [25.1124, 55.1390], match: [palm]}
  burj al arab: {at: [25.1412, 55.1853], match: [al arab]}
  ain dubai: {at: [25.0794, 55.1201], match: [ain dubai, dubai eye]}
  dubai frame: {at: [25.2354, 55.3003], match: [frame]}
# Communities whose "sea view" means looking across the Gulf. Dubai's coast runs
# roughly south-west to north-east, so the open sea lies to the north-west.
sea_direction:
  Dubai Marina: NW
  Jumeirah Beach Residence (JBR): NW
  Dubai Harbour: NW
  Bluewaters Island: NW
  Al Sufouh: NW
  Jumeirah Lake Towers (JLT): NW
# Approximate community centres (for bearings to landmarks)
centres:
