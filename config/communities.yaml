# Microclimate sites and community -> microclimate mapping.
# Coordinates are approximate area centres (WGS84) used only to fetch weather.
# Mapping rule (design choice, verify: true): distance from the Gulf coast
#   < ~3 km -> coastal, ~3-12 km -> central, > ~12 km -> inland.
# Phase 1 may merge sites if the weather data cannot tell them apart.

microclimates:
  coastal:
    label: Coastal (Dubai Marina area)
